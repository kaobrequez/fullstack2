<!doctype html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/script.js" type="module"></script>
</head>

<body class="contenedor-registro">

    <div class="card card-registro">
        <header class="card-header">
            <p class="card-header-title is-centered title is-4 has-text-primary">
                Registro de usuario
            </p>
        </header>

        <div class="card-content">
            <form action="#" method="post" id="formulario-registro">

                <!-- Nombre de usuario -->
                <div class="field">
                    <label class="label" for="username">Nombre de usuario</label>
                    <div class="control">
                        <input class="input is-primary" type="text" id="username" name="username" placeholder="Ej. usuario123" required autocomplete="username">
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="field">
                    <label class="label" for="password">Contraseña</label>
                    <div class="control">
                        <input class="input is-primary" type="password" id="password" name="password" placeholder="***********" required autocomplete="new-password">
                    </div>
                </div>

                <!-- Correo electrónico -->
                <div class="field">
                    <label class="label" for="email">Correo electrónico</label>
                    <div class="control">
                        <input class="input is-primary" type="email" id="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="email">
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="field">
                    <label class="label" for="phone">Teléfono móvil</label>
                    <div class="control">
                        <input class="input is-primary" type="tel" id="phone" name="phone" placeholder="+56912345678" pattern="^(\+?56)?\s?9\d{8}$" title="Ingrese un número chileno válido" required autocomplete="tel">
                    </div>
                </div>

                <!-- Edad -->
                <div class="field">
                    <label class="label" for="age">Edad</label>
                    <div class="control">
                        <input class="input is-primary" type="number" id="age" name="age" placeholder="25" min="1" max="120" required>
                    </div>
                </div>

                <!-- País -->
                <div class="field">
                    <label class="label" for="country">País</label>
                    <div class="control">
                        <div class="select is-primary is-fullwidth">
                            <select id="country" name="country" required>
                                <option value="" selected disabled>Seleccione país</option>
                                <option value="AR">Argentina</option>
                                <option value="BO">Bolivia</option>
                                <option value="BR">Brasil</option>
                                <option value="CL">Chile</option>
                                <option value="CO">Colombia</option>
                                <option value="EC">Ecuador</option>
                                <option value="MX">México</option>
                                <option value="PE">Perú</option>
                                <option value="UY">Uruguay</option>
                                <option value="VE">Venezuela</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Género -->
                <div class="field">
                    <label class="label">Género</label>
                    <div class="control">
                        <label class="radio">
                            <input type="radio" name="gender" value="masculino" required>
                            Masculino
                        </label>
                        <label class="radio">
                            <input type="radio" name="gender" value="femenino">
                            Femenino
                        </label>
                        <label class="radio">
                            <input type="radio" name="gender" value="prefiero-no-decirlo">
                            Otro
                        </label>
                    </div>
                </div>

                <!-- Newsletter -->
                <div class="field mt-4">
                    <div class="control">
                        <label class="checkbox">
                            <input type="checkbox" name="newsletter" value="true">
                            ¿Deseas suscribirte al newsletter?
                        </label>
                    </div>
                </div>

                <!-- Botón de envío -->
                <div class="field mt-5">
                    <div class="control">
                        <button class="button is-primary is-fullwidth is-medium" type="submit">
                            Registrarse
                        </button>
                    </div>
                </div>

                <p class="has-text-centered mt-4">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
                </p>

            </form>
        </div>
    </div>

    <!-- Mensajes de alerta -->
    <article class="message is-warning" id="contenedor-mensaje" >
        <div class="message-header">
            <p>Mensajes</p>
        </div>
        <div class="message-body" id="mensaje"></div>
    </article>

</body>
</html>
